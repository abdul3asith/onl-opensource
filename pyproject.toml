[project]
name = "deploycheck"
version = "0.1.0"
description = "Profile, optimize and verify robot policies (VLAs) on real hardware."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "torch>=2.3",
]

[project.optional-dependencies]
# Real robot policies. Install with: uv pip install -e ".[lerobot]"
lerobot = ["lerobot>=0.3"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
deploycheck = "deploycheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
